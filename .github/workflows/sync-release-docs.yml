name: Sync release docs

# リリースが公開されたら、このリポジトリの README / CHANGELOG を追従させてコミットする。
#
# なぜこのリポジトリに置くか:
#   Release はソース(Private)側の release.yml が PAT(RELEASES_TOKEN)でここに作る。
#   GITHUB_TOKEN 以外で作られたリリースは release イベントを発火させるので、この
#   ワークフローはここで起動できる。必要な材料(タグ・公開日・リリース本文)は全部
#   このリポジトリ側にあり、Private リポジトリへのアクセスも追加の PAT も要らない。
#   本番のリリース経路(署名・公証・publish)に手を入れずに済むのも利点で、
#   ここが失敗してもリリース自体は公開済みのまま残る。
#
# 更新するもの(正は scripts/sync-release-docs.py の MARKER_TARGETS):
#   README.md / README.ja.md          … latest-release(最新版表示)と release-badge
#   .github/ISSUE_TEMPLATE/bug_report … latest-version(バージョン欄の記入例)
#   CHANGELOG.md                      … releases にタグごとの節を追加
#
# **版に依存する文言は必ずマーカーの内側に置くこと。** 外にベタ書きするとリリースの
# たびに古いまま取り残される。Release バッジを shields の動的エンドポイントではなく
# 版を URL に埋めた静的バッジにしているのも同じ理由で、URL が変わらないと GitHub の
# 画像プロキシ(camo)が古い画像を掴んだままになり、更新しても旧版が表示され続ける。
#
# CHANGELOG は未知のタグだけを足す。公開後に手で整えた節は次回以降も残る。
# リリース本文を編集して反映し直したいときは、手動実行(workflow_dispatch)の
# regenerate にタグを入れる(書式: Ver_X.Y.Z / Ver_X.Y.Z+N)。
#
# 追加のシークレットは不要。push はこのリポジトリの GITHUB_TOKEN で行う。
# GITHUB_TOKEN の push は他のワークフローを起動しないので、自己ループしない。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      regenerate:
        description: 'リリース本文から作り直すタグ(カンマ区切り。空なら未知のタグのみ追加)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sync-release-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release イベントの checkout は既定でタグを指すため、既定ブランチを明示する。
          ref: ${{ github.event.repository.default_branch }}

      - name: Update docs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # シェルへ直接展開せず env 経由で渡す(入力値をコマンドとして解釈させない)。
          REGENERATE: ${{ inputs.regenerate }}
        run: |
          # 取得も更新も refresh-docs.sh に通す。手元で同じコマンドを叩けば同じ結果になる。
          if [ -n "$REGENERATE" ]; then
            ./scripts/refresh-docs.sh --regenerate "$REGENERATE"
          else
            ./scripts/refresh-docs.sh
          fi

      - name: Commit
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # 追跡ファイルの変更を全部拾う。ファイル名を列挙すると、更新対象を
          # 増やしたときにここへの追記を忘れて黙って取りこぼす(実際に Issue
          # テンプレートの記入例で起きかけた)。書き換えるのは sync-release-docs.py
          # だけなので、-u で足りる。
          git add -u
          if git diff --cached --quiet; then
            echo "::notice::差分なし。コミットしません。"
            exit 0
          fi
          echo "更新されたファイル:"
          git diff --cached --name-only
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: リリース ${TAG:-の公開} に合わせてドキュメントを更新する"
          # 手動実行が重なった場合に備えて、rebase してから push する。
          git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"
          git push
